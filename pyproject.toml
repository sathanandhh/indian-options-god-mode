[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-options-god-mode"
version = "5.1.0-rc1"
description = "Institutional-grade Quantitative MCP for Indian Options"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2.0",
    
    "yfinance>=0.2",
    "scipy>=1.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "arch>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]